<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#b8c2cf" /><title>Oturumlar | Oturum Seçim Uygulaması</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="manager-page">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">Oturum Seçim Uygulaması</div>
      <div class="topbar-right"><div class="identity"><span class="avatar" id="personIcon" aria-hidden="true"></span><div id="userIdentity">Yükleniyor…</div></div>
      <div class="topbar-actions"><button class="button" id="refreshBtn" type="button">Yenile</button><button class="button" id="logoutBtn" type="button">Çıkış</button></div></div>
    </div>
  </header>
  <main class="wrap">
    <section class="intro" aria-labelledby="pageTitle">
      <div><h1 id="pageTitle">Oturumlar</h1><p>Uygun oturumları seçebilirsiniz</p></div>
      <div class="deadline" id="deadlineBanner"><span id="clockIcon" aria-hidden="true"></span><div><span id="deadlineLabel">Son seçim tarihi</span><strong id="deadlineValue">Yükleniyor…</strong></div></div>
    </section>
    <section class="my-section" id="mySelectionSection" aria-labelledby="myTitle">
      <div class="section-title"><h2 id="myTitle" tabindex="-1">Seçimlerim</h2><span class="count" id="myCount">0</span></div>
      <div class="selection-list" id="mySelections"></div>
    </section>
    <section class="calendar-section" aria-labelledby="calendarTitle">
      <div class="calendar-heading"><div class="section-title"><h2 id="calendarTitle">Oturum takvimi</h2><span class="title-note" id="roleNote"></span></div><div class="months" id="monthSwitch" aria-label="Ay filtresi"></div></div>
      <div class="legend" aria-label="Durumların anlamları">
        <span class="legend-item"><span class="legend-symbol available" aria-hidden="true"><span class="ring"></span></span>Uygun</span>
        <span class="legend-item"><span class="legend-symbol mine" id="legendCheck" aria-hidden="true"></span>Seçildi</span>
        <span class="legend-item"><span class="legend-symbol full" aria-hidden="true"><span class="dot"></span></span>Tam dolu</span>
        <span class="legend-item"><span class="legend-symbol unavailable" id="legendLock" aria-hidden="true"></span>Şu an seçilemiyor</span>
      </div>
      <div class="move-banner" id="moveMessage" hidden><span id="moveText"></span><button class="text-button" type="button" id="cancelMoveBtn">Vazgeç</button></div>
      <div id="calendar"></div>
    </section>
    <footer><span>Tüm saatler Türkiye saatidir.</span><span>Takvim yaklaşık 20 saniyede bir yenilenir.</span></footer>
    <noscript><p>Oturumları görüntülemek için tarayıcınızda JavaScript açık olmalıdır.</p></noscript>
  </main>
  <dialog id="confirmDialog" aria-labelledby="dialogTitle" aria-describedby="dialogText">
    <h2 id="dialogTitle"></h2><p id="dialogText"></p>
    <div class="dialog-actions"><button type="button" class="button" id="dialogCancel">Vazgeç</button><button type="button" class="button primary" id="dialogConfirm">Onayla</button></div>
  </dialog>
  <div id="busyOverlay" class="busy-overlay" hidden><div class="busy-panel"><div class="spinner" aria-hidden="true"></div><p class="busy-label" role="status">İşlem yapılıyor…</p></div></div>
  <script type="module" src="select.js"></script>
</body>
</html>
