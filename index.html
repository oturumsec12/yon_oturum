<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#b8c2cf" />
  <title>Giriş | Oturum seçim uygulaması</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Oturum seçim uygulaması</h1>
      <p class="intro" id="loginIntro">Size verilen 5 karakterli kodla giriş yapabilirsiniz.</p>
      <form id="loginForm" novalidate>
        <label for="accessCode">Giriş kodu</label>
        <input id="accessCode" name="accessCode" type="text"
          autocomplete="off" autocapitalize="characters" spellcheck="false"
          pattern="[A-Za-z0-9]{5}" minlength="5" maxlength="5"
          aria-describedby="loginIntro loginError" aria-invalid="false" required />
        <button type="submit">Giriş yap</button>
      </form>
      <p id="loginError" class="message error" role="alert" hidden></p>
      <noscript><p class="message info">Giriş yapmak için JavaScript açık olmalıdır.</p></noscript>
    </section>
  </main>
  <div id="busyOverlay" class="busy-overlay" hidden><div class="busy-panel"><div class="spinner"></div><p class="busy-label">Giriş yapılıyor…</p></div></div>
  <script type="module" src="login.js"></script>
</body>
</html>
